<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compras</title>
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compras">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f6f4ef; --card: #ffffff; --text: #1d1d1b; --muted: #6d6a63; --line: #e4e0d6;
  --accent: #2f6b4f; --accent-soft: #e3efe8; --done: #a6a29a; --sheet: #ffffff; --shade: rgba(0,0,0,.35);
  --photo-bg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412; --card: #1f1f1c; --text: #f0eee8; --muted: #a29e95; --line: #33322d;
    --accent: #6cc39a; --accent-soft: #23362c; --done: #6a675f; --sheet: #1f1f1c; --shade: rgba(0,0,0,.6);
    --photo-bg: #f4f4f2;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 24px) env(safe-area-inset-left);
}
header, main, .rodape { max-width: 640px; margin-left: auto; margin-right: auto; }
header { padding: 20px 16px 8px; }
h1 { font-size: 30px; margin: 0; letter-spacing: -.02em; }
.progresso { color: var(--muted); font-size: 15px; margin-top: 2px; }
.barra { height: 4px; background: var(--line); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.receitas { color: var(--muted); font-size: 14px; margin-top: 8px; }
section { margin: 18px 12px 0; }
section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 4px 6px; font-weight: 600; }
section h2 span { text-transform: none; letter-spacing: 0; font-weight: 400; }
section.feita h2 { color: var(--done); }
ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 12px; overflow: hidden; }
li { display: flex; align-items: stretch; border-top: 1px solid var(--line); min-height: 60px; }
li:first-child { border-top: 0; }
.marca { flex: 0 0 56px; display: flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; cursor: pointer; }
.marca i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted); display: block; position: relative; }
li.comprado .marca i { background: var(--accent); border-color: var(--accent); }
li.comprado .marca i::after { content: ""; position: absolute; left: 7px; top: 3px; width: 7px; height: 12px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 10px 14px 10px 0; cursor: pointer; }
.nomes { flex: 1; min-width: 0; }
.de { font-weight: 600; }
.pt { color: var(--muted); font-size: 15px; }
.qtd { color: var(--muted); font-size: 15px; white-space: nowrap; }
.etiqueta { display: inline-block; vertical-align: middle; margin-left: 6px; font-size: 12px; font-weight: 600; line-height: 1; color: var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 3px 8px; text-decoration: none; }
li.comprado .etiqueta { color: var(--done); background: none; padding: 0; }
.painel h3 .etiqueta { font-size: 13px; position: relative; top: -2px; }
.seta { color: var(--line); font-size: 20px; }
li.comprado .de, li.comprado .pt, li.comprado .qtd { color: var(--done); text-decoration: line-through; }
.rodape { text-align: center; margin: 28px auto 0; padding: 0 16px; }
.rodape button { font: inherit; font-size: 15px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 20px; padding: 8px 16px; }
.rodape .botoes { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.rodape button.confirmar { color: #c0392b; border-color: #c0392b; }
.versao { color: var(--done); font-size: 12px; margin-top: 12px; }

/* Painel de produtos */
.fundo { position: fixed; inset: 0; background: var(--shade); opacity: 0; pointer-events: none; transition: opacity .2s; touch-action: none; }
/* Lista de trás travada enquanto o painel está aberto. */
body.travado { position: fixed; left: 0; right: 0; overflow: hidden; }
.fundo.aberto { opacity: 1; pointer-events: auto; }
.painel { position: fixed; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; max-height: 88vh; background: var(--sheet); border-radius: 16px 16px 0 0;
  transform: translateY(100%); transition: transform .25s ease; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom); }
.painel.aberto { transform: none; }
.painel.arrastando, .fundo.arrastando { transition: none; }
.painel .topo { padding: 10px 16px 12px; border-bottom: 1px solid var(--line); position: relative; }
.painel .alca { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
.painel h3 { margin: 0; font-size: 22px; padding-right: 84px; }
.painel .sub { color: var(--muted); }
.compartilhar { position: absolute; right: 52px; top: 18px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--line); color: var(--text); padding: 0; display: flex; align-items: center; justify-content: center; }
.compartilhar svg { width: 17px; height: 17px; }
/* Tudo que reage a clique mostra a mãozinha (no iPhone não faz diferença). */
.compartilhar, .fechar, .rodape button { cursor: pointer; }
.produto img, .foto-grande { cursor: zoom-in; }
.ampliada { cursor: zoom-out; }
.aviso { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 18px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.aviso.visivel { opacity: 1; }
.fechar { position: absolute; right: 12px; top: 18px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--line); color: var(--text); font-size: 18px; line-height: 32px; padding: 0; }
.painel .corpo { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; flex: 1 1 auto; min-height: 0; padding: 12px 16px 20px; }
.painel .topo { touch-action: none; }
.obs { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-bottom: 14px; }
.produto { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.produto:first-of-type { border-top: 0; }
.produto img { width: 96px; height: 96px; object-fit: contain; background: var(--photo-bg); border-radius: 10px; flex: 0 0 96px; }
.produto .sem { width: 96px; height: 96px; border-radius: 10px; background: var(--line); flex: 0 0 96px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; text-align: center; }
.produto .loja { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
.produto .nome { font-size: 16px; }
.produto a { font-size: 14px; color: var(--accent); }
.foto-grande { width: 100%; max-height: 50vh; object-fit: contain; background: var(--photo-bg); border-radius: 12px; margin-bottom: 12px; }
.ampliada { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 10; }
.ampliada.aberto { display: flex; }
.ampliada img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>
<header>
  <h1>Compras</h1>
  <div class="progresso" id="progresso"></div>
  <div class="barra"><i id="barra"></i></div>
  <div class="receitas" id="receitas"></div>
</header>
<main id="lista"></main>
<div class="rodape">
  <div class="botoes">
    <button id="limpar" type="button">Desmarcar tudo</button>
    <button id="restaurar" type="button">Restaurar</button>
  </div>
  <div class="versao" id="versao"></div>
</div>

<div class="fundo" id="fundo"></div>
<div class="painel" id="painel" role="dialog" aria-modal="true" aria-labelledby="p-titulo">
  <div class="topo">
    <div class="alca"></div>
    <h3 id="p-titulo"></h3>
    <div class="sub" id="p-sub"></div>
    <button class="compartilhar" id="compartilhar" type="button" aria-label="Compartilhar link do produto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
    <button class="fechar" id="fechar" type="button" aria-label="Fechar">✕</button>
  </div>
  <div class="corpo" id="p-corpo"></div>
</div>
<div class="ampliada" id="ampliada"><img alt=""></div>
<div class="aviso" id="aviso" role="status"></div>

<script>
"use strict";
const CHAVE = "compras.marcados";
const CHAVE_SERVIDOR = "compras.marcados.servidor";
let dados = null;
let marcados = new Set();

function carregarMarcados() {
  try { marcados = new Set(JSON.parse(localStorage.getItem(CHAVE) || "[]")); } catch (e) { marcados = new Set(); }
}
function salvarMarcados() {
  try { localStorage.setItem(CHAVE, JSON.stringify([...marcados].sort())); } catch (e) {}
}

// Posição da lista: salva enquanto rola e ao sair, e volta para ela depois de desenhar
// a lista (o navegador sozinho não consegue, porque a lista é montada depois de carregar).
// Guarda junto a "assinatura" da lista (os itens, em ordem): se a lista mudou, começa do topo.
const CHAVE_SCROLL = "compras.scroll";
let restaurado = false, salvarScrollTimer = null;
if ("scrollRestoration" in history) history.scrollRestoration = "manual";

function assinatura() {
  return dados.secoes.map((s) => s.itens.map((i) => i.id).join("|")).join("||");
}
function salvarScroll() {
  if (!restaurado || !dados) return;
  // Com o painel aberto a página fica travada (scrollY = 0); vale a posição guardada.
  const y = scrollSalvo !== null ? scrollSalvo : window.scrollY;
  try { localStorage.setItem(CHAVE_SCROLL, JSON.stringify({ y: Math.round(y), lista: assinatura() })); } catch (e) {}
}
function restaurarScroll() {
  try {
    const s = JSON.parse(localStorage.getItem(CHAVE_SCROLL) || "null");
    if (s && s.lista === assinatura() && s.y > 0) window.scrollTo(0, s.y);
  } catch (e) {}
  restaurado = true;
}
window.addEventListener("scroll", () => {
  clearTimeout(salvarScrollTimer);
  salvarScrollTimer = setTimeout(salvarScroll, 150);
}, { passive: true });
window.addEventListener("pagehide", salvarScroll);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") salvarScroll(); });

function el(tag, attrs, ...filhos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const f of filhos) if (f != null && f !== "") n.append(f);
  return n;
}

function desenhar() {
  const lista = document.getElementById("lista");
  lista.textContent = "";
  let total = 0, feitos = 0;
  const secoes = dados.secoes.map((s) => {
    const pend = s.itens.filter((i) => !marcados.has(i.id));
    const comp = s.itens.filter((i) => marcados.has(i.id));
    total += s.itens.length; feitos += comp.length;
    return { s, itens: [...pend, ...comp], feita: pend.length === 0 };
  });
  // Seções já completas vão para o fim.
  const ordem = [...secoes.filter((x) => !x.feita), ...secoes.filter((x) => x.feita)];
  for (const { s, itens, feita } of ordem) {
    const ul = el("ul");
    for (const i of itens) {
      const comprado = marcados.has(i.id);
      ul.append(el("li", { class: comprado ? "comprado" : "" },
        el("button", { class: "marca", type: "button", "aria-label": (comprado ? "Desmarcar " : "Marcar ") + i.de, onclick: () => alternar(i.id) }, el("i")),
        el("button", { class: "info", type: "button", onclick: () => abrir(i) },
          el("div", { class: "nomes" }, el("div", { class: "de" }, i.de, etiqueta(i)), el("div", { class: "pt" }, i.pt)),
          el("span", { class: "qtd" }, i.qtd),
          el("span", { class: "seta" }, "›"))));
    }
    lista.append(el("section", { class: feita ? "feita" : "" },
      el("h2", {}, s.de, s.pt ? el("span", {}, " · " + s.pt) : null), ul));
  }
  document.getElementById("progresso").textContent = `${feitos} de ${total} comprados`;
  document.getElementById("barra").style.width = total ? (100 * feitos / total) + "%" : "0";
}

function etiqueta(i) {
  return i.opcional ? el("span", { class: "etiqueta" }, "opcional") : null;
}

function alternar(id) {
  if (marcados.has(id)) marcados.delete(id); else marcados.add(id);
  salvarMarcados();
  desenhar();
}

function img(src, cls) {
  const i = el("img", { src, alt: "", loading: "lazy", class: cls || "" });
  i.addEventListener("click", () => ampliar(src));
  return i;
}

// Deeplink: cada item tem um endereço próprio, "#<slug>" (ex.: "#linguica-fresca").
// Abrir um item muda o endereço (dá para compartilhar); fechar volta ao endereço da lista.
let aberto = null;
const porSlug = new Map();

function abrir(i, { historico = true } = {}) {
  aberto = i;
  if (historico && location.hash !== "#" + i.slug) history.pushState({ painel: i.slug }, "", "#" + i.slug);
  const titulo = document.getElementById("p-titulo");
  titulo.textContent = "";
  titulo.append(i.de, etiqueta(i) || "");
  document.getElementById("p-sub").textContent = [i.pt, i.qtd].filter(Boolean).join(" · ");
  const corpo = document.getElementById("p-corpo");
  corpo.textContent = "";
  if (i.foto) corpo.append(img(i.foto, "foto-grande"));
  if (i.obs) corpo.append(el("div", { class: "obs" }, i.obs));
  for (const p of i.produtos) {
    corpo.append(el("div", { class: "produto" },
      p.foto ? img(p.foto) : (i.foto ? null : el("div", { class: "sem" }, "sem foto")),
      el("div", {},
        el("div", { class: "loja" }, p.loja),
        el("div", { class: "nome" }, p.nome),
        p.url ? el("a", { href: p.url, target: "_blank", rel: "noopener" }, "ver no site") : null)));
  }
  if (!i.foto && !i.obs && !i.produtos.length) corpo.append(el("div", { class: "sub" }, "Sem produtos cadastrados."));
  corpo.scrollTop = 0;
  travarFundo();
  document.getElementById("fundo").classList.add("aberto");
  document.getElementById("painel").classList.add("aberto");
}
function fechar({ historico = true } = {}) {
  aberto = null;
  if (historico && location.hash) {
    if (history.state && history.state.painel) history.back();
    else history.replaceState(null, "", location.pathname + location.search);
  }
  const p = document.getElementById("painel"), f = document.getElementById("fundo");
  p.classList.remove("arrastando"); f.classList.remove("arrastando");
  p.style.transform = ""; f.style.opacity = "";
  f.classList.remove("aberto");
  p.classList.remove("aberto");
  destravarFundo();
}

// Trava a lista de trás no lugar (o iOS ignora overflow:hidden no body).
let scrollSalvo = null;
function travarFundo() {
  if (scrollSalvo !== null) return;
  scrollSalvo = window.scrollY;
  document.body.style.top = -scrollSalvo + "px";
  document.body.classList.add("travado");
}
function destravarFundo() {
  if (scrollSalvo === null) return;
  document.body.classList.remove("travado");
  document.body.style.top = "";
  window.scrollTo(0, scrollSalvo);
  scrollSalvo = null;
}
function ampliar(src) {
  const a = document.getElementById("ampliada");
  a.querySelector("img").src = src;
  a.classList.add("aberto");
}

function aplicarEndereco() {
  const i = porSlug.get(decodeURIComponent(location.hash.slice(1)));
  if (i) { if (aberto !== i) abrir(i, { historico: false }); }
  else {
    if (aberto) fechar({ historico: false });
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  }
}
window.addEventListener("popstate", aplicarEndereco);

let avisoTimer = null;
function avisar(texto) {
  const a = document.getElementById("aviso");
  a.textContent = texto; a.classList.add("visivel");
  clearTimeout(avisoTimer); avisoTimer = setTimeout(() => a.classList.remove("visivel"), 1800);
}
document.getElementById("compartilhar").addEventListener("click", async () => {
  if (!aberto) return;
  const url = location.origin + location.pathname + "#" + aberto.slug;
  if (navigator.share) {
    // Só o link: com "title"/"text" junto, alguns destinos (Brave, Copiar no iOS) colam o texto no link.
    try { await navigator.share({ url }); } catch (e) {}
  } else {
    try { await navigator.clipboard.writeText(url); avisar("Link copiado"); } catch (e) { avisar(url); }
  }
});

document.getElementById("fundo").addEventListener("click", () => fechar());
document.getElementById("fechar").addEventListener("click", () => fechar());
document.getElementById("ampliada").addEventListener("click", (e) => e.currentTarget.classList.remove("aberto"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { document.getElementById("ampliada").classList.remove("aberto"); fechar(); } });

// Arrastar o painel para baixo fecha (como as folhas do iOS):
// - começando no título, o arraste sempre move o painel;
// - no conteúdo, puxar para baixo com o conteúdo no topo move o painel; senão, rola o conteúdo;
// - se o conteúdo chega ao topo no meio do gesto, o painel passa a acompanhar o dedo.
// Ao soltar, fecha se arrastou mais de 1/4 da altura (ou 120 px) ou com um peteleco rápido.
(() => {
  const p = document.getElementById("painel"), f = document.getElementById("fundo"), corpo = document.getElementById("p-corpo");
  let toque = null;

  p.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) { toque = null; return; }
    const y = e.touches[0].clientY;
    toque = { y0: y, ultimo: y, base: y, modo: null, noTitulo: !corpo.contains(e.target), hist: [[e.timeStamp, y]] };
  }, { passive: true });

  p.addEventListener("touchmove", (e) => {
    if (!toque) return;
    const y = e.touches[0].clientY;
    const desce = y > toque.ultimo;
    toque.hist.push([e.timeStamp, y]);
    if (toque.hist.length > 6) toque.hist.shift();
    const rolavel = corpo.scrollHeight > corpo.clientHeight + 1;
    if (!toque.modo) {
      const dy = y - toque.y0;
      if (Math.abs(dy) < 6) { toque.ultimo = y; return; }
      toque.modo = (toque.noTitulo || (dy > 0 && corpo.scrollTop <= 0)) ? "arrastar" : "rolar";
      toque.base = y;
    } else if (toque.modo === "rolar" && desce && corpo.scrollTop <= 0) {
      toque.modo = "arrastar"; toque.base = y;
    }
    toque.ultimo = y;
    if (toque.modo === "arrastar") {
      e.preventDefault();
      const d = Math.max(0, y - toque.base);
      p.classList.add("arrastando"); f.classList.add("arrastando");
      p.style.transform = `translateY(${d}px)`;
      f.style.opacity = String(Math.max(0, 1 - d / p.offsetHeight));
    } else if (!rolavel) {
      e.preventDefault();
    }
  }, { passive: false });

  function soltar() {
    if (!toque) return;
    const t = toque; toque = null;
    if (t.modo !== "arrastar") return;
    const d = Math.max(0, t.ultimo - t.base);
    const [t0, y0] = t.hist[0], [t1, y1] = t.hist[t.hist.length - 1];
    const vel = t1 > t0 ? (y1 - y0) / (t1 - t0) : 0; // px/ms
    if (d > Math.min(120, p.offsetHeight / 4) || (vel > 0.5 && d > 20)) {
      fechar();
    } else {
      p.classList.remove("arrastando"); f.classList.remove("arrastando");
      p.style.transform = ""; f.style.opacity = "";
    }
  }
  p.addEventListener("touchend", soltar);
  p.addEventListener("touchcancel", soltar);
  // Nada de rolar a lista de trás tocando no fundo escuro.
  f.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
})();

// Botão que pede um segundo toque (em até 3 s) antes de agir.
function comConfirmacao(botao, pedido, acao) {
  const texto = botao.textContent;
  let ate = 0;
  const voltar = () => { ate = 0; botao.classList.remove("confirmar"); botao.textContent = texto; };
  botao.addEventListener("click", () => {
    if (Date.now() < ate) { voltar(); acao(); return; }
    ate = Date.now() + 3000; botao.classList.add("confirmar"); botao.textContent = pedido;
    setTimeout(() => { if (Date.now() >= ate) voltar(); }, 3100);
  });
}

// Desmarca tudo, inclusive o que veio marcado do servidor (e continua assim nas
// próximas versões, até o .shopping-checked mudar).
comConfirmacao(document.getElementById("limpar"), "Toque de novo para desmarcar tudo", () => {
  marcados.clear(); salvarMarcados(); desenhar();
});

// Esquece as marcações do celular e volta ao estado do .shopping-checked.
comConfirmacao(document.getElementById("restaurar"), "Toque de novo para restaurar", () => {
  const doServidor = marcadosDoServidor();
  marcados = new Set(doServidor); salvarMarcados();
  try { localStorage.setItem(CHAVE_SERVIDOR, JSON.stringify([...doServidor].sort())); } catch (e) {}
  desenhar();
});

function marcadosDoServidor() {
  return new Set(dados.secoes.flatMap((s) => s.itens.filter((i) => i.marcado).map((i) => i.id)));
}

async function iniciar() {
  carregarMarcados();
  const r = await fetch("dados.json");
  dados = await r.json();
  // Esquece marcações de itens que não estão mais na lista.
  const ids = new Set(dados.secoes.flatMap((s) => s.itens.map((i) => i.id)));
  marcados = new Set([...marcados].filter((id) => ids.has(id)));
  // Marcações vindas do .shopping-checked (cook server): só o que mudou desde a
  // última versão vista entra aqui, para não desfazer o que foi mudado no celular.
  const doServidor = marcadosDoServidor();
  let vistos = null;
  try { vistos = new Set(JSON.parse(localStorage.getItem(CHAVE_SERVIDOR) || "[]")); } catch (e) { vistos = new Set(); }
  for (const id of doServidor) if (!vistos.has(id)) marcados.add(id);
  for (const id of vistos) if (!doServidor.has(id)) marcados.delete(id);
  try { localStorage.setItem(CHAVE_SERVIDOR, JSON.stringify([...doServidor].sort())); } catch (e) {}
  salvarMarcados();
  document.getElementById("receitas").textContent = dados.receitas.join(" · ");
  porSlug.clear();
  for (const s of dados.secoes) for (const i of s.itens) porSlug.set(i.slug, i);
  desenhar();
  restaurarScroll();
  aplicarEndereco();
}

// ---- Atualização e cache offline ----
// A cada abertura (e quando o app volta para a frente), lê versao.json direto do
// servidor. Se a versão mudou, baixa TODOS os arquivos para um cache novo, ignorando
// o cache HTTP, e só troca de versão quando tudo foi baixado. O sw.js serve o cache
// da versão em uso; "?rede=" faz o pedido passar direto para a rede.
const META = "compras-meta";
const CHAVE_VERSAO = "versao-em-uso";
let atualizando = false;

function rodape(texto) { document.getElementById("versao").textContent = texto; }

async function versaoEmUso() {
  try {
    const r = await (await caches.open(META)).match(CHAVE_VERSAO);
    return r ? await r.text() : null;
  } catch (e) { return null; }
}

async function atualizar() {
  if (atualizando || !("caches" in window)) return;
  atualizando = true;
  const atual = await versaoEmUso();
  try {
    const r = await fetch("versao.json?rede=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("versao.json " + r.status);
    const { versao, arquivos } = await r.json();
    if (versao === atual) { rodape("versão " + atual); return; }
    const nome = "compras-" + versao;
    await caches.delete(nome);
    const c = await caches.open(nome);
    let n = 0;
    for (const a of arquivos) {
      rodape(`baixando lista nova… ${++n}/${arquivos.length}`);
      const resp = await fetch(a + "?rede=" + versao, { cache: "reload" });
      if (!resp.ok) throw new Error(a + " " + resp.status);
      await c.put(a, resp);
    }
    await (await caches.open(META)).put(CHAVE_VERSAO, new Response(versao));
    for (const k of await caches.keys()) if (k.startsWith("compras-") && k !== nome && k !== META) await caches.delete(k);
    if (atual) location.reload(); else rodape("versão " + versao);
  } catch (e) {
    rodape(atual ? `versão ${atual} · sem conexão, usando a lista salva` : "sem conexão");
  } finally {
    atualizando = false;
  }
}

iniciar().then(() => {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then((reg) => reg.update()).catch(() => {}).finally(atualizar);
  }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") atualizar(); });
</script>
